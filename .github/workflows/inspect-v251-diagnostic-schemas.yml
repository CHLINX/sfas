name: Inspect v2.51 diagnostic schemas
on:
  push:
    branches:
      - inspect-v251-full-zip-20261029
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect diagnostic schemas
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, zipfile
          url = "https://raw.githubusercontent.com/CHLINX/sso/main/SSO_v2.51_%E5%80%8B%E8%82%A1%E7%8D%A8%E7%AB%8B%E8%A9%95%E4%BC%B0_%E9%87%8F%E8%83%BD%E6%B6%88%E8%9E%8D%E8%88%87%E9%85%8D%E5%B0%8D%E6%AF%94%E8%BC%83%E7%B5%90%E6%9E%9C.zip"
          data = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"SSO-diagnostic-schema"}), timeout=90).read()
          z = zipfile.ZipFile(io.BytesIO(data))
          targets = (
            "個股評估逐筆資料_多成本情境_v2.51停用量能.csv",
            "樣本外機率區間門檻診斷_v2.51停用量能.csv",
            "最新全市場候選持續評估_v2.51停用量能.csv",
            "最新10檔獲利可能性排行_v2.51停用量能.csv",
            "預測分位組樣本外實際績效_v2.51停用量能.csv",
            "獲利機率校準檢驗總結_v2.51停用量能.csv",
          )
          for i in z.infolist():
            base = i.filename.rsplit("/",1)[-1]
            if base not in targets: continue
            print("\n###", i.filename, "bytes", i.file_size)
            with z.open(i.filename) as f:
              header = f.readline()
              data1 = f.readline()
              data2 = f.readline()
            for j,raw in enumerate([header,data1,data2]):
              try: line=raw.decode("utf-8-sig")
              except UnicodeDecodeError: line=raw.decode("cp950",errors="replace")
              print("ROW",j,line.rstrip("\r\n")[:2500])
          PY
