name: Inspect SSO v2.50 individual candidate schema
on:
  push:
    branches:
      - inspect-v250-results-20261029
    paths:
      - .github/workflows/inspect-v250-individual.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read individual-candidate CSVs from public result ZIP
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, zipfile
          url = "https://raw.githubusercontent.com/CHLINX/sso/main/SSO_v2.50_%E6%97%A5%E6%88%90%E4%BA%A4%E9%87%8F%E7%89%B9%E5%BE%B5%E8%88%87500%E6%97%A5%E6%AA%A2%E6%9F%A5%E9%BB%9E%E7%B5%90%E6%9E%9C.zip"
          req = urllib.request.Request(url, headers={"User-Agent": "SSO-individual-candidate-inspector"})
          with urllib.request.urlopen(req, timeout=120) as response:
              blob = response.read()
          print("ZIP bytes:", len(blob))
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              names=z.namelist()
              for token in ("歷史樣本外每日10檔候選", "10檔組合逐籃子逐股成交明細", "最新全市場候選持續評估", "上漲潛力分級實際績效檢驗"):
                  found=[n for n in names if token in n and n.lower().endswith(".csv")]
                  if not found:
                      print("\nNOT FOUND:",token); continue
                  name=found[0]; raw=z.read(name)
                  try: text=raw.decode("utf-8-sig")
                  except UnicodeDecodeError: text=raw.decode("cp950",errors="replace")
                  reader=csv.DictReader(io.StringIO(text))
                  rows=[]
                  count=0
                  for row in reader:
                      count += 1
                      if len(rows)<3: rows.append(row)
                  print("\n###",name,"rows=",count,"bytes=",len(raw))
                  print("COLUMNS:",json.dumps(list(rows[0].keys()) if rows else [],ensure_ascii=False))
                  for i,row in enumerate(rows,1):
                      print("SAMPLE",i,json.dumps(row,ensure_ascii=False))
          PY
