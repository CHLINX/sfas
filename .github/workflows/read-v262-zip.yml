name: Read public v2.62 frozen-spec ZIP via Python

# Temporary read-only workflow; never run this workflow on main.
on:
  push:
    branches:
      - tmp/read-v262-zip
    paths:
      - ".github/workflows/read-v262-zip.yml"
      - "tools/read_v262_zip_focus.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/read-v262-zip
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download, verify, and inspect v2.62 ZIP
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/read_v262_zip_focus.py
