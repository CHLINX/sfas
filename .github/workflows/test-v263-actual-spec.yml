name: Verify v2.62 archive compatibility for v2.63 recorder

on:
  push:
    branches:
      - tmp/test-v263-actual-spec
    paths:
      - ".github/workflows/test-v263-actual-spec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the actual public v2.62 ZIP and required templates
        run: |
          python - <<'PY'
          import io, json, urllib.request, zipfile
          from urllib.parse import quote
          repo = "CHLINX/sso"
          name = "SSO_v2.62_前瞻影子驗證規格封存結果_20261029_165713.zip"
          url = "https://raw.githubusercontent.com/" + repo + "/main/" + quote(name, safe="")
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"v263-compatibility-test"}), timeout=90) as r:
              blob = r.read()
          print("download_bytes=", len(blob))
          assert len(blob) == 9039
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              names = [i.filename.rsplit("/", 1)[-1] for i in z.infolist() if not i.is_dir()]
              print("member_count=", len(names))
              assert "v2.62_前瞻驗證規格封存.json" in names
              for item in (
                  "v2.62_每日訊號紀錄模板.csv",
                  "v2.62_逐股候選紀錄模板.csv",
                  "v2.62_到期結果回填模板.csv",
                  "v2.62_每日組合彙總模板.csv",
              ):
                  assert item in names, "missing template: " + item
              spec = json.loads(z.read(next(n for n in z.namelist() if n.rsplit("/",1)[-1] == "v2.62_前瞻驗證規格封存.json")).decode("utf-8-sig"))
              assert spec["spec_id"] == "SSO_FROZEN_v2.62_20261029_165713"
              assert spec["status"] == "FROZEN_FOR_FORWARD_SHADOW_VALIDATION"
              assert spec["primary_evaluation"]["holding_period_H"] == 5
              assert spec["hypothesis"]["上漲潛力"] == "高"
              assert spec["hypothesis"]["預測淨報酬"] == "> 0"
              for item in ("v2.62_每日訊號紀錄模板.csv","v2.62_逐股候選紀錄模板.csv","v2.62_到期結果回填模板.csv","v2.62_每日組合彙總模板.csv"):
                  header = z.read(next(n for n in z.namelist() if n.rsplit("/",1)[-1] == item)).decode("utf-8-sig").splitlines()[0]
                  print("template_ok=", item, "columns=", len(header.split(",")))
          print("ACTUAL_V262_ARCHIVE_COMPATIBILITY_OK")
          PY
