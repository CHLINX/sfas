name: Inspect v2.51 result ZIP
on:
  push:
    branches:
      - inspect-v251-full-zip-20261029
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect published ZIP
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, zipfile
          url = "https://raw.githubusercontent.com/CHLINX/sso/main/SSO_v2.51_%E5%80%8B%E8%82%A1%E7%8D%A8%E7%AB%8B%E8%A9%95%E4%BC%B0_%E9%87%8F%E8%83%BD%E6%B6%88%E8%9E%8D%E8%88%87%E9%85%8D%E5%B0%8D%E6%AF%94%E8%BC%83%E7%B5%90%E6%9E%9C.zip"
          req = urllib.request.Request(url, headers={"User-Agent": "SSO-result-inspector"})
          data = urllib.request.urlopen(req, timeout=90).read()
          print("ZIP_BYTES", len(data))
          z = zipfile.ZipFile(io.BytesIO(data))
          infos = z.infolist()
          print("ZIP_FILES", len(infos))
          for i in infos:
              print("FILE", i.file_size, i.filename)
          targets = [
              "候選個股獨立績效總結_v2.51停用量能.csv",
              "候選排名逐檔績效_v2.51停用量能.csv",
              "候選獲利機率區間實際績效_v2.51停用量能.csv",
              "預測排序能力總結_v2.51停用量能.csv",
              "分類機率能力總結_v2.51停用量能.csv",
              "最新10檔獲利可能性排行_v2.51停用量能.csv",
              "最新達標獲利候選最多10檔_v2.51停用量能.csv",
              "個股候選逐筆績效摘要_v2.51停用量能.csv",
              "個股歷史重複入選績效_v2.51停用量能.csv",
          ]
          for info in infos:
              name = info.filename
              if not name.lower().endswith(".csv"):
                  continue
              base = name.rsplit("/", 1)[-1]
              in_pair = "配對比較" in name
              if base not in targets and not in_pair:
                  continue
              print("\n### CSV", name, "bytes", info.file_size)
              if info.file_size > 5_000_000:
                  print("SKIPPED_LARGE_CSV")
                  continue
              raw = z.read(name)
              decoded = None
              for enc in ("utf-8-sig", "utf-8", "cp950"):
                  try:
                      decoded = raw.decode(enc)
                      break
                  except UnicodeDecodeError:
                      pass
              if decoded is None:
                  print("DECODE_FAILED")
                  continue
              rows = list(csv.DictReader(io.StringIO(decoded)))
              if rows:
                  print("COLUMNS", json.dumps(list(rows[0].keys()), ensure_ascii=False))
              max_rows = min(len(rows), 30 if in_pair else 15)
              print("ROW_COUNT", len(rows), "PRINT_ROWS", max_rows)
              for row in rows[:max_rows]:
                  clean = {k: (v[:220] if isinstance(v, str) else v) for k, v in row.items()}
                  print(json.dumps(clean, ensure_ascii=False))
          PY
