name: Inspect v2.50 baseline ZIP schema (temporary)

on:
  push:
    branches:
      - tmp/read-v250-schema
    paths:
      - ".github/workflows/read-v250-schema.yml"
      - "tools/read_v250_schema.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/read-v250-schema
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and inspect ZIP schema
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/read_v250_schema.py
